<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="office-token" content="{{TOKEN}}">
<meta name="office-demo" content="{{DEMO}}">
<meta name="color-scheme" content="dark light">
<meta name="description" content="A living pixel office for every AI coding agent on your machine.">
<title>Claude Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=Silkscreen&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<meta name="theme-color" content="#0a0c12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23121522'/%3E%3Crect x='3' y='3' width='3' height='3' fill='%23ffd76a'/%3E%3Crect x='7' y='3' width='3' height='3' fill='%23ffd76a'/%3E%3Crect x='11' y='3' width='2' height='3' fill='%2338e07b'/%3E%3Crect x='3' y='9' width='10' height='4' fill='%23ff7a45'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#panel">Skip to the inspector</a>
<header class="top">
  <div class="brand">
    <canvas class="logo" id="logo" width="17" height="17" aria-hidden="true"></canvas>
    <span class="wordmark" id="officeName">Claude Office</span>
    <button class="olvl" id="officeLvl" hidden></button>
    <span class="visits" id="visits" hidden></span>
    <button class="giftchip" id="giftChip" type="button" hidden></button>
  </div>
  <div class="pulse" id="pulse" aria-live="polite"><i class="dot"></i><span id="pulseText">Opening the office…</span></div>
  <div class="actions">
    <button class="btn search" id="btnPalette" title="Search seats, sessions and actions"></button>
    <button class="btn primary" id="btnHire" title="Start a new lane (H)"></button>
    <button class="btn icon ghost" id="btnMenu" title="Preferences" aria-haspopup="true" aria-expanded="false"></button>
  </div>
</header>

<nav class="tabs" aria-label="Views">
  <button class="tab on" data-view="floor"></button>
  <button class="tab" data-view="timeline"></button>
  <button class="tab" data-view="board"></button>
  <button class="tab" data-view="stats"></button>
  <span class="spacer"></span>
  <span class="livebadge off" id="live"><i></i><span>Connecting</span></span>
  <span class="clock" id="clock"></span>
  <button class="btn icon ghost sm panel-toggle" id="btnPanel" aria-controls="panel" aria-pressed="true" title="Hide the inspector (\)"></button>
</nav>

<main class="main">
  <section class="viewport">
    <div class="view" id="viewFloor">
      <div class="floor-frame"><div class="stage-scroll"><div class="stage" id="stage" aria-label="Office floor" tabindex="-1"></div></div><div class="floor-hint" id="floorHint" hidden></div></div>
      <section class="dock" id="dock" aria-label="Right now">
        <div class="dock-h"><h4>Right now</h4><span class="dock-count" id="rnCount"></span><div class="latest" id="latest"></div></div>
        <div class="rn-grid" id="rightnow"></div>
      </section>
    </div>
    <div class="view" id="viewTimeline" hidden></div>
    <div class="view" id="viewBoard" hidden></div>
    <div class="view" id="viewStats" hidden></div>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-controls="panel" aria-label="Inspector width" tabindex="0" title="Drag to resize the inspector. Double-click to reset."><i></i></div>
  <aside class="panel" id="panel" aria-label="Inspector" tabindex="-1"><div class="panel-in"><div class="skeleton" style="width:60%"></div><div class="skeleton"></div><div class="skeleton" style="width:80%"></div></div></aside>
</main>

<div class="toasts" id="toasts" role="status" popover="manual"></div>
<div class="tip" id="tip" hidden></div>
<dialog id="dialog"><div id="dialogBody"></div></dialog>
<script type="module" src="/static/app.js"></script>
</body>
</html>
